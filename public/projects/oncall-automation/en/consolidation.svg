<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="580" fill="#FAFAFA"/>

  <!-- BEFORE label -->
  <text x="40" y="55" font-size="11" font-weight="700" fill="#999" letter-spacing="1.5">BEFORE</text>

  <!-- BEFORE Path 1: Shakebug → Shared channel -->
  <g>
    <rect x="40" y="75" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <text x="100" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Shakebug</text>
    <text x="100" y="115" text-anchor="middle" font-size="11" fill="#666">User bug reports</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 160 100 L 220 100" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="220" y="75" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <text x="310" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Shared Slack channel</text>
    <text x="310" y="115" text-anchor="middle" font-size="10" fill="#999">(all teams, no tag filter)</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 400 100 L 470 130" marker-end="url(#arrow)"/>
  </g>

  <!-- BEFORE: Shakebug direct → On-call (curved arrow, dashed, going up and over) -->
  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 160 85 C 250 35, 450 35, 540 110" marker-end="url(#arrow)" stroke-dasharray="3 3"/>
  </g>
  <rect x="265" y="38" width="270" height="18" fill="#FAFAFA"/>
  <text x="400" y="51" text-anchor="middle" font-size="10" fill="#666" font-style="italic">or check Shakebug site directly (no tag filter)</text>

  <!-- BEFORE Path 2: Internal channels -->
  <g>
    <rect x="40" y="195" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <text x="130" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Internal Slack channels</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 220 220 L 470 165" marker-end="url(#arrow)"/>
  </g>

  <!-- On-call engineer -->
  <g>
    <rect x="470" y="115" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <text x="570" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">On-call engineer</text>
    <text x="570" y="158" text-anchor="middle" font-size="11" fill="#666">Manually filters across all</text>
  </g>

  <!-- Pain note -->
  <text x="400" y="275" text-anchor="middle" font-size="12" fill="#C44" font-style="italic">
    Pain points: multiple sources to scan · manual triage for team-relevant bugs · easy to miss reports
  </text>

  <!-- Divider -->
  <line x1="40" y1="305" x2="760" y2="305" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- AFTER label -->
  <text x="40" y="340" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="1.5">AFTER</text>

  <!-- AFTER Path 1: Shakebug → Shared channel → n8n -->
  <g>
    <rect x="40" y="360" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="100" y="383" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Shakebug</text>
    <text x="100" y="400" text-anchor="middle" font-size="11" fill="#666">User bug reports</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 160 385 L 200 385" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="200" y="360" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="280" y="383" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Shared Slack channel</text>
    <text x="280" y="400" text-anchor="middle" font-size="10" fill="#999">(all teams)</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 360 385 L 400 385" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="400" y="360" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="475" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">n8n workflow</text>
    <text x="475" y="396" text-anchor="middle" font-size="10" fill="#666">subscribe + tag check</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 550 385 L 600 440" marker-end="url(#arrow)"/>
  </g>

  <!-- AFTER Path 2: Internal users → Slack Workflow -->
  <g>
    <rect x="40" y="440" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="120" y="463" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Internal users</text>
    <text x="120" y="480" text-anchor="middle" font-size="11" fill="#666">Report via form</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 200 465 L 240 465" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="240" y="440" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="320" y="460" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Slack Workflow</text>
    <text x="320" y="476" text-anchor="middle" font-size="10" fill="#666">structured form</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 400 465 L 600 465" marker-end="url(#arrow)"/>
  </g>

  <!-- Single Jira board (highlighted) -->
  <g>
    <rect x="600" y="415" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="685" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Single Jira board</text>
    <line x1="615" y1="450" x2="755" y2="450" stroke="#E5E5E5" stroke-width="1"/>
    <text x="685" y="468" text-anchor="middle" font-size="11" fill="#666">Tickets with original</text>
    <text x="685" y="483" text-anchor="middle" font-size="11" fill="#666">Shakebug / Slack links</text>
  </g>

  <!-- Caption -->
  <text x="400" y="540" text-anchor="middle" font-size="12" fill="#666" font-style="italic">
    Two intake paths, two right tools → both end in one Jira board with original context preserved.
  </text>

  <!-- Arrow definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
</svg>
