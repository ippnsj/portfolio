<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="'Noto Sans CJK KR', 'Noto Sans KR', system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="580" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="1">위치 검증 플로우</text>

  <!-- Start -->
  <g>
    <rect x="350" y="65" width="100" height="36" rx="18" fill="#1a1a1a"/>
    <text x="400" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">시작</text>
  </g>

  <!-- Arrow down -->
  <line x1="400" y1="101" x2="400" y2="125" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision 1: country valid? -->
  <g>
    <polygon points="400,130 510,170 400,210 290,170" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="400" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Country 값이</text>
    <text x="400" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">유효한가?</text>
  </g>

  <!-- No → Country selector -->
  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 290 170 L 175 170" marker-end="url(#arrow)"/>
  </g>
  <text x="232" y="160" text-anchor="middle" font-size="11" fill="#666">No</text>

  <g>
    <rect x="40" y="150" width="135" height="40" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <text x="107" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">국가 선택 화면</text>
  </g>

  <!-- Yes ↓ -->
  <line x1="400" y1="210" x2="400" y2="235" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="225" font-size="11" fill="#666">Yes</text>

  <!-- Decision 2: mode == country only? -->
  <g>
    <polygon points="400,240 530,290 400,340 270,290" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="400" y="287" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">mode가</text>
    <text x="400" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">country인가?</text>
  </g>

  <!-- Yes → Original page (right) -->
  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 530 290 L 625 290" marker-end="url(#arrow)"/>
  </g>
  <text x="575" y="280" text-anchor="middle" font-size="11" fill="#666">Yes</text>

  <g>
    <rect x="625" y="270" width="135" height="40" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
    <text x="693" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">원래 페이지</text>
  </g>

  <!-- No ↓ -->
  <line x1="400" y1="340" x2="400" y2="365" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="355" font-size="11" fill="#666">No</text>

  <!-- Decision 3: area valid? -->
  <g>
    <polygon points="400,370 510,410 400,450 290,410" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="400" y="406" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Area 값이</text>
    <text x="400" y="423" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">유효한가?</text>
  </g>

  <!-- Yes → Original page (left, loop back) -->
  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 510 410 L 625 410 L 625 310" marker-end="url(#arrow)"/>
  </g>
  <text x="565" y="400" text-anchor="middle" font-size="11" fill="#666">Yes</text>

  <!-- No ↓ -->
  <line x1="400" y1="450" x2="400" y2="475" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="465" font-size="11" fill="#666">No</text>

  <!-- Decision 4: has saved addresses? -->
  <g>
    <polygon points="400,480 540,520 400,560 260,520" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="400" y="517" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">저장된 주소 리스트가</text>
    <text x="400" y="533" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">있는가?</text>
  </g>

  <!-- No → Map screen (left) -->
  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 260 520 L 175 520" marker-end="url(#arrow)"/>
  </g>
  <text x="217" y="510" text-anchor="middle" font-size="11" fill="#666">No</text>

  <g>
    <rect x="40" y="500" width="135" height="40" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <text x="107" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">지도 화면</text>
  </g>

  <!-- Yes → Address list (right) -->
  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 540 520 L 625 520" marker-end="url(#arrow)"/>
  </g>
  <text x="582" y="510" text-anchor="middle" font-size="11" fill="#666">Yes</text>

  <g>
    <rect x="625" y="500" width="135" height="40" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <text x="693" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">주소 선택 화면</text>
  </g>

  <!-- Arrow definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
</svg>
