<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="900" height="560" fill="#FAFAFA"/>
  <text x="450" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="1">Accurate Success Measurement</text>
  <text x="450" y="58" text-anchor="middle" font-size="11.5" fill="#666">The failure is never erased; recovery counts only when the user actually enters the VLP</text>

  <rect x="290" y="78" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
  <text x="450" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">SLI = (valid &#8722; failures) / valid</text>

  <text x="450" y="138" text-anchor="middle" font-size="10.5" fill="#999">valid = all valid events (the denominator, both successes and failures), failures = those that failed</text>

  <text x="450" y="162" text-anchor="middle" font-size="11" fill="#666">Each entry: valid +1, each failure: failures +1 &#8212; failures are never erased after the fact</text>
  <text x="450" y="181" text-anchor="middle" font-size="11" fill="#666">On VLP entry after branch selection, valid +1 again &#8594; success dilutes the failure, another failure accumulates</text>

  <text x="60" y="205" font-size="11" font-weight="700" fill="#999" letter-spacing="1.2">RESULT BY CASE</text>

  <rect x="60" y="218" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="80" y="244" font-size="12" font-weight="700" fill="#1a1a1a">&#9312; Leaves without selecting</text>
  <text x="80" y="264" font-size="10.5" fill="#666">Exits the fallback screen, no branch</text>
  <line x1="80" y1="278" x2="290" y2="278" stroke="#EEEEEE" stroke-width="1"/>
  <text x="80" y="300" font-size="11" fill="#1a1a1a">First entry only: valid +1, fail +1</text>
  <text x="80" y="322" font-size="11" fill="#666" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(1 &#8722; 1) / 1</text>
  <text x="80" y="350" font-size="15" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">= 0</text>
  <text x="148" y="350" font-size="10.5" fill="#666">failure remains</text>

  <rect x="325" y="218" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
  <text x="345" y="244" font-size="12" font-weight="700" fill="#1a1a1a">&#9313; Selects &#8594; entry succeeds</text>
  <text x="345" y="264" font-size="10.5" fill="#666">Picks a branch, VLP loads OK</text>
  <line x1="345" y1="278" x2="555" y2="278" stroke="#EEEEEE" stroke-width="1"/>
  <text x="345" y="300" font-size="11" fill="#1a1a1a">+ VLP entry: valid +1 (no fail)</text>
  <text x="345" y="322" font-size="11" fill="#666" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(2 &#8722; 1) / 2</text>
  <text x="345" y="350" font-size="15" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">= 0.5</text>
  <text x="418" y="350" font-size="10.5" fill="#666">partial recovery</text>

  <rect x="590" y="218" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="610" y="244" font-size="12" font-weight="700" fill="#1a1a1a">&#9314; Selects &#8594; fails again</text>
  <text x="610" y="264" font-size="10.5" fill="#666">VLP entry fails for another reason</text>
  <line x1="610" y1="278" x2="820" y2="278" stroke="#EEEEEE" stroke-width="1"/>
  <text x="610" y="300" font-size="11" fill="#1a1a1a">+ VLP entry: valid +1, fail +1</text>
  <text x="610" y="322" font-size="11" fill="#666" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(2 &#8722; 2) / 2</text>
  <text x="610" y="350" font-size="15" font-weight="700" fill="#1a1a1a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">= 0</text>
  <text x="678" y="350" font-size="10.5" fill="#666">failure accumulates</text>

  <text x="60" y="412" font-size="11" font-weight="700" fill="#999" letter-spacing="1.2">WHY THIS IS HONEST</text>
  <rect x="60" y="424" width="780" height="112" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="80" y="450" font-size="11.5" fill="#1a1a1a">&#183; The first failure is <tspan font-weight="700">never erased</tspan> &#8212; showing the fallback screen alone is not counted as success</text>
  <text x="80" y="475" font-size="11.5" fill="#1a1a1a">&#183; valid grows <tspan font-weight="700">only when</tspan> the user selects a branch and actually enters the VLP (&#9313;); otherwise the failure stays (&#9312;, &#9314;)</text>
  <text x="80" y="500" font-size="11.5" fill="#1a1a1a">&#183; &#9313; is 0.5, not 1, by design &#8212; it reflects the real experience of "blocked once, then recovered"</text>
  <text x="80" y="524" font-size="10.5" fill="#999" font-style="italic">&#8594; guarantees any SLI gain comes from real user recovery, not from gaming the metric</text>
</svg>
