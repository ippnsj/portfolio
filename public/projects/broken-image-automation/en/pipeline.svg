<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#FAFAFA"/>

  <text x="450" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="1">Broken-Image Automated Reporting Pipeline</text>
  <text x="450" y="58" text-anchor="middle" font-size="11.5" fill="#666">Runs automatically every week — the items to fix reach the Content team without manual follow-up</text>

  <!-- Trigger badge -->
  <rect x="350" y="86" width="200" height="34" rx="17" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
  <text x="450" y="108" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">GitHub Actions · Every Monday</text>

  <!-- vertical arrow down -->
  <line x1="450" y1="120" x2="450" y2="150" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 1: New Relic -->
  <rect x="40" y="158" width="185" height="120" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="132" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">1 · Collect (New Relic)</text>
  <text x="132" y="220" text-anchor="middle" font-size="10.5" fill="#666">Top 10 broken images</text>
  <text x="132" y="236" text-anchor="middle" font-size="10.5" fill="#666">per country (404)</text>
  <text x="132" y="252" text-anchor="middle" font-size="10.5" fill="#666">via NRQL, by frequency</text>

  <line x1="225" y1="218" x2="262" y2="218" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Google Sheet -->
  <rect x="264" y="158" width="185" height="120" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="356" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">2 · Record (Google Sheet)</text>
  <text x="356" y="220" text-anchor="middle" font-size="10.5" fill="#666">Auto-logged to a monthly</text>
  <text x="356" y="236" text-anchor="middle" font-size="10.5" fill="#666">sheet with metadata</text>
  <text x="356" y="252" text-anchor="middle" font-size="10.5" fill="#666">(branch_id, etc.)</text>

  <line x1="449" y1="218" x2="486" y2="218" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Slack -->
  <rect x="488" y="158" width="185" height="120" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="580" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">3 · Notify (Slack)</text>
  <text x="580" y="220" text-anchor="middle" font-size="10.5" fill="#666">Mentions the Content team</text>
  <text x="580" y="236" text-anchor="middle" font-size="10.5" fill="#666">with the sheet link,</text>
  <text x="580" y="252" text-anchor="middle" font-size="10.5" fill="#666">prompting follow-up fixes</text>

  <line x1="673" y1="218" x2="710" y2="218" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Outcome: Content team -->
  <rect x="712" y="158" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="787" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Content Team</text>
  <text x="787" y="228" text-anchor="middle" font-size="10.5" fill="#666">Fixes the flagged</text>
  <text x="787" y="248" text-anchor="middle" font-size="10.5" fill="#666">images proactively</text>

  <!-- Bottom note -->
  <rect x="40" y="300" width="822" height="40" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="60" y="325" font-size="11" fill="#1a1a1a">Connects the disconnect between observability data (New Relic) and the team that fixes it (Content) via a hands-off weekly pipeline.</text>
</svg>
