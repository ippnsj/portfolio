<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" font-family="system-ui, -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="900" height="388" fill="#FAFAFA"/>

  <text x="450" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="1">중복 로직 없이 branch_id 주입</text>
  <text x="450" y="58" text-anchor="middle" font-size="11.5" fill="#666">콘텐츠 팀이 요청한 branch_id를, 모든 사용처를 수정하지 않고 한 곳에서 제공</text>

  <!-- ===== Two rejected alternatives (left) ===== -->
  <text x="60" y="92" font-size="11" font-weight="700" fill="#999" letter-spacing="1.2">검토한 대안</text>

  <!-- Alt 1: Provider -->
  <rect x="60" y="104" width="360" height="86" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="78" y="128" font-size="12" font-weight="700" fill="#1a1a1a">Provider 주입</text>
  <text x="78" y="149" font-size="10.5" fill="#666">route가 branch_id를 가진 경우에만 주입 가능</text>
  <text x="78" y="167" font-size="10.5" fill="#999">→ branch_id 없는 화면에는 주입할 값 자체가 없음</text>
  <text x="384" y="133" font-size="18" fill="#999">✕</text>

  <!-- Alt 2: BLoC UseCase -->
  <rect x="60" y="200" width="360" height="86" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="78" y="224" font-size="12" font-weight="700" fill="#1a1a1a">BLoC마다 동일 UseCase 주입</text>
  <text x="78" y="245" font-size="10.5" fill="#666">각 화면 BLoC이 같은 조회 로직을 각자 보유</text>
  <text x="78" y="263" font-size="10.5" fill="#999">→ 도메인 조회 로직이 여러 곳에 중복, 수정 범위 큼</text>
  <text x="384" y="229" font-size="18" fill="#999">✕</text>

  <!-- ===== Chosen: Inherited Widget (right) ===== -->
  <text x="455" y="92" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="1.2">채택 — Inherited Widget</text>

  <!-- Outer wrapper = whole route -->
  <rect x="455" y="104" width="385" height="182" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="475" y="128" font-size="11.5" font-weight="700" fill="#1a1a1a">Inherited Widget (전체 route를 감쌈)</text>
  <text x="475" y="147" font-size="10" fill="#666">domain 계층에서 branch_id를 한 곳에서만 조회</text>

  <!-- child screens inside -->
  <rect x="475" y="160" width="111" height="58" rx="6" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1.2"/>
  <text x="530" y="184" text-anchor="middle" font-size="10" fill="#666">하위 화면 A</text>
  <text x="530" y="201" text-anchor="middle" font-size="9" fill="#999">context로 꺼냄</text>

  <rect x="596" y="160" width="111" height="58" rx="6" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1.2"/>
  <text x="651" y="184" text-anchor="middle" font-size="10" fill="#666">하위 화면 B</text>
  <text x="651" y="201" text-anchor="middle" font-size="9" fill="#999">context로 꺼냄</text>

  <rect x="717" y="160" width="111" height="58" rx="6" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1.2"/>
  <text x="772" y="184" text-anchor="middle" font-size="10" fill="#666">하위 화면 C</text>
  <text x="772" y="201" text-anchor="middle" font-size="9" fill="#999">context로 꺼냄</text>

  <text x="475" y="245" font-size="10.5" fill="#1a1a1a">하위 화면은 조회 로직을 따로 갖지 않고 context에서 값만 꺼냄</text>
  <text x="475" y="265" font-size="10.5" fill="#666">branch_id가 있으면 어디서든 반환, 없으면 <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">null</tspan></text>

  <!-- Bottom takeaway -->
  <rect x="60" y="312" width="780" height="58" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="80" y="336" font-size="11" fill="#1a1a1a">전체 route를 한 번 감싸 <tspan font-weight="700">도메인 조회를 한 곳에 모음</tspan> → 모든 사용처를 수정하거나 로직을 중복하지 않고도</text>
  <text x="80" y="356" font-size="11" fill="#1a1a1a">콘텐츠 팀이 요청한 branch_id를 이미지 관측 데이터에 실어 보낼 수 있게 됨.</text>
</svg>
