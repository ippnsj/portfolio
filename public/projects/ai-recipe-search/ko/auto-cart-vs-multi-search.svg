<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Noto Sans CJK KR', 'Noto Sans KR', system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="380" fill="#FAFAFA"/>

  <!-- Left card: Auto-cart -->
  <g>
    <rect x="130" y="60" width="240" height="260" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>

    <text x="250" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">자동 담기</text>
    <text x="250" y="115" text-anchor="middle" font-size="11" fill="#999">편의성 우선</text>

    <line x1="155" y1="135" x2="345" y2="135" stroke="#E5E5E5" stroke-width="1"/>

    <g font-size="12">
      <text x="155" y="165" fill="#1a1a1a" font-weight="600">편의성</text>
      <text x="345" y="165" text-anchor="end" font-size="14" fill="#1a1a1a">↑</text>
      <text x="155" y="183" font-size="10" fill="#666">재료 자동 담기</text>

      <text x="155" y="215" fill="#1a1a1a" font-weight="600">선택권</text>
      <text x="345" y="215" text-anchor="end" font-size="14" fill="#999">↓</text>
      <text x="155" y="233" font-size="10" fill="#666">시스템이 전부 결정</text>

      <text x="155" y="265" fill="#1a1a1a" font-weight="600">브랜드 / 옵션</text>
      <text x="345" y="265" text-anchor="end" font-size="14" fill="#999">↓</text>
      <text x="155" y="283" font-size="10" fill="#666">원하는 거 못 고름</text>
    </g>
  </g>

  <!-- Right card: Multi-search (chosen) -->
  <g>
    <rect x="430" y="60" width="240" height="260" rx="12" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2.5"/>

    <g>
      <rect x="555" y="50" width="105" height="22" rx="11" fill="#1a1a1a"/>
      <text x="607" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">채택</text>
    </g>

    <text x="550" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">멀티 검색 진입</text>
    <text x="550" y="115" text-anchor="middle" font-size="11" fill="#999">선택권 우선</text>

    <line x1="455" y1="135" x2="645" y2="135" stroke="#E5E5E5" stroke-width="1"/>

    <g font-size="12">
      <text x="455" y="165" fill="#1a1a1a" font-weight="600">편의성</text>
      <text x="645" y="165" text-anchor="end" font-size="14" fill="#1a1a1a">↑</text>
      <text x="455" y="183" font-size="10" fill="#666">재료 자동 검색</text>

      <text x="455" y="215" fill="#1a1a1a" font-weight="600">선택권</text>
      <text x="645" y="215" text-anchor="end" font-size="14" fill="#1a1a1a">↑</text>
      <text x="455" y="233" font-size="10" fill="#666">사용자가 직접 고름</text>

      <text x="455" y="265" fill="#1a1a1a" font-weight="600">브랜드 / 옵션</text>
      <text x="645" y="265" text-anchor="end" font-size="14" fill="#1a1a1a">↑</text>
      <text x="455" y="283" font-size="10" fill="#666">원하는 대로 고름</text>
    </g>
  </g>

  <!-- Bottom caption -->
  <text x="400" y="355" text-anchor="middle" font-size="12" fill="#666" font-style="italic">
    자동 담기는 편의성만 살리고 선택권을 잃음. 멀티 검색은 편의성과 선택권 모두 확보
  </text>
</svg>
