<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Noto Sans CJK KR', 'Noto Sans KR', system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="420" fill="#FAFAFA"/>

  <!-- BEFORE label -->
  <text x="40" y="65" font-size="11" font-weight="700" fill="#999" letter-spacing="1.5">이전</text>

  <!-- BEFORE row -->
  <g>
    <rect x="40" y="80" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <text x="120" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">외부 앱</text>
    <text x="120" y="130" text-anchor="middle" font-size="11" fill="#666">레시피 검색</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 200 105 C 215 95, 235 95, 250 105" marker-end="url(#arrow)"/>
    <path d="M 250 130 C 235 140, 215 140, 200 130" marker-end="url(#arrow)"/>
  </g>
  <text x="225" y="160" text-anchor="middle" font-size="10" fill="#666" font-style="italic">반복</text>

  <g>
    <rect x="250" y="80" width="510" height="70" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
    <text x="505" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">자사 앱</text>
    <text x="505" y="130" text-anchor="middle" font-size="11" fill="#666">재료별로 검색·담기</text>
  </g>

  <!-- Pain points -->
  <text x="400" y="195" text-anchor="middle" font-size="12" fill="#C44" font-style="italic">
    불편한 점: 반복적인 재료 복사 붙여넣기 · 앱 전환 · 어디까지 담았는지 확인
  </text>

  <line x1="40" y1="220" x2="760" y2="220" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- AFTER label -->
  <text x="40" y="255" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="1.5">이후</text>

  <g>
    <rect x="40" y="270" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="125" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">자사 앱</text>
    <text x="125" y="320" text-anchor="middle" font-size="11" fill="#666">레시피 검색</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 210 305 L 250 305" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="250" y="270" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="360" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">재료 자동 추출</text>
    <text x="360" y="320" text-anchor="middle" font-size="11" fill="#666">LLM 활용</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none">
    <path d="M 470 305 L 510 305" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="510" y="270" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="620" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">멀티 검색 진입</text>
    <text x="620" y="320" text-anchor="middle" font-size="11" fill="#666">재료 자동 입력</text>
  </g>

  <!-- Caption -->
  <text x="400" y="385" text-anchor="middle" font-size="12" fill="#666" font-style="italic">
    앱 전환 없이 레시피에서 재료를 자동으로 한 번에 검색 가능
  </text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
</svg>
