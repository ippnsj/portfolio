<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="380" fill="#FAFAFA"/>

  <!-- Left card: Auto-cart -->
  <g>
    <rect x="130" y="60" width="240" height="260" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>

    <!-- Header -->
    <text x="250" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Auto-cart</text>
    <text x="250" y="115" text-anchor="middle" font-size="11" fill="#999">Convenience first</text>

    <!-- Divider -->
    <line x1="155" y1="135" x2="345" y2="135" stroke="#E5E5E5" stroke-width="1"/>

    <!-- Tradeoffs -->
    <g font-size="12">
      <!-- Convenience -->
      <text x="155" y="165" fill="#1a1a1a" font-weight="600">Convenience</text>
      <text x="345" y="165" text-anchor="end" font-size="14" fill="#1a1a1a">✓</text>
      <text x="155" y="183" font-size="10" fill="#666">Items auto-added</text>

      <!-- User control -->
      <text x="155" y="215" fill="#1a1a1a" font-weight="600">User control</text>
      <text x="345" y="215" text-anchor="end" font-size="14" fill="#999">✗</text>
      <text x="155" y="233" font-size="10" fill="#666">System decides everything</text>

      <!-- Brand / options -->
      <text x="155" y="265" fill="#1a1a1a" font-weight="600">Brand / options</text>
      <text x="345" y="265" text-anchor="end" font-size="14" fill="#999">✗</text>
      <text x="155" y="283" font-size="10" fill="#666">User intent not reflected</text>
    </g>
  </g>

  <!-- Right card: Multi-search (chosen) -->
  <g>
    <rect x="430" y="60" width="240" height="260" rx="12" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2.5"/>

    <!-- "Chosen" badge -->
    <g>
      <rect x="555" y="50" width="105" height="22" rx="11" fill="#1a1a1a"/>
      <text x="607" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">CHOSEN</text>
    </g>

    <!-- Header -->
    <text x="550" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Multi-search entry</text>
    <text x="550" y="115" text-anchor="middle" font-size="11" fill="#999">User control first</text>

    <!-- Divider -->
    <line x1="455" y1="135" x2="645" y2="135" stroke="#E5E5E5" stroke-width="1"/>

    <!-- Tradeoffs -->
    <g font-size="12">
      <!-- Convenience -->
      <text x="455" y="165" fill="#1a1a1a" font-weight="600">Convenience</text>
      <text x="645" y="165" text-anchor="end" font-size="14" fill="#1a1a1a">✓</text>
      <text x="455" y="183" font-size="10" fill="#666">Auto-routed to search</text>

      <!-- User control -->
      <text x="455" y="215" fill="#1a1a1a" font-weight="600">User control</text>
      <text x="645" y="215" text-anchor="end" font-size="14" fill="#1a1a1a">✓</text>
      <text x="455" y="233" font-size="10" fill="#666">User picks each item</text>

      <!-- Brand / options -->
      <text x="455" y="265" fill="#1a1a1a" font-weight="600">Brand / options</text>
      <text x="645" y="265" text-anchor="end" font-size="14" fill="#1a1a1a">✓</text>
      <text x="455" y="283" font-size="10" fill="#666">User intent preserved</text>
    </g>
  </g>

  <!-- Bottom caption -->
  <text x="400" y="355" text-anchor="middle" font-size="12" fill="#666" font-style="italic">
    Auto-cart removes the user's brand and option choice. Multi-search keeps the convenience without the cost.
  </text>
</svg>
