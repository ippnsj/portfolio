<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Noto Sans', system-ui, -apple-system, sans-serif">
  <rect width="900" height="680" fill="#FAFAFA"/>

  <defs>
    <marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="0.5">Color Synchronization on Tab Switch</text>
  <text x="450" y="59" text-anchor="middle" font-size="11" fill="#999">Switching tabs recolors the header, tab bar, and some child components; text color flips by background brightness</text>

  <!-- ============ PHONE A: light header ============ -->
  <text x="240" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#999" letter-spacing="1">TAB A — Light header</text>
  <rect x="120" y="112" width="240" height="210" rx="20" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>

  <path d="M120 132 a20 20 0 0 1 20 -20 h200 a20 20 0 0 1 20 20 v68 h-240 z" fill="#EDEDED"/>
  <text x="140" y="150" font-size="11" font-weight="700" fill="#1a1a1a">Header</text>
  <text x="340" y="150" text-anchor="end" font-size="8.5" fill="#888">Light bg → black text</text>

  <rect x="138" y="166" width="62" height="30" rx="5" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
  <text x="169" y="185" text-anchor="middle" font-size="10" fill="#1a1a1a">Home</text>
  <rect x="206" y="166" width="62" height="30" rx="5" fill="#E3E3E3"/>
  <text x="237" y="185" text-anchor="middle" font-size="10" fill="#999">Fresh</text>
  <rect x="274" y="166" width="62" height="30" rx="5" fill="#E3E3E3"/>
  <text x="305" y="185" text-anchor="middle" font-size="10" fill="#999">Snacks</text>

  <rect x="138" y="216" width="184" height="44" rx="4" fill="#F4F4F4" stroke="#EAEAEA" stroke-width="1"/>
  <text x="230" y="242" text-anchor="middle" font-size="9" fill="#999">Component</text>
  <rect x="138" y="270" width="184" height="38" rx="4" fill="#F8F8F8" stroke="#EFEFEF" stroke-width="1"/>
  <text x="230" y="293" text-anchor="middle" font-size="9" fill="#BBBBBB">...</text>

  <line x1="378" y1="217" x2="520" y2="217" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arc)"/>
  <text x="450" y="208" text-anchor="middle" font-size="10" fill="#666" font-style="italic">switch tab</text>

  <!-- ============ PHONE B: dark header ============ -->
  <text x="660" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#999" letter-spacing="1">TAB B — Dark header</text>
  <rect x="540" y="112" width="240" height="210" rx="20" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>

  <path d="M540 132 a20 20 0 0 1 20 -20 h200 a20 20 0 0 1 20 20 v68 h-240 z" fill="#3A3A3A"/>
  <text x="560" y="150" font-size="11" font-weight="700" fill="#FFFFFF">Header</text>
  <text x="760" y="150" text-anchor="end" font-size="8.5" fill="#BBB">Dark bg → white text</text>

  <rect x="558" y="166" width="62" height="30" rx="5" fill="#2E2E2E" stroke="#FFFFFF" stroke-width="2"/>
  <text x="589" y="185" text-anchor="middle" font-size="10" fill="#FFFFFF">Home</text>
  <rect x="626" y="166" width="62" height="30" rx="5" fill="#525252"/>
  <text x="657" y="185" text-anchor="middle" font-size="10" fill="#BBB">Fresh</text>
  <rect x="694" y="166" width="62" height="30" rx="5" fill="#525252"/>
  <text x="725" y="185" text-anchor="middle" font-size="10" fill="#BBB">Snacks</text>

  <rect x="558" y="216" width="184" height="44" rx="4" fill="#F4F4F4" stroke="#EAEAEA" stroke-width="1"/>
  <text x="650" y="242" text-anchor="middle" font-size="9" fill="#999">Component</text>
  <rect x="558" y="270" width="184" height="38" rx="4" fill="#F8F8F8" stroke="#EFEFEF" stroke-width="1"/>
  <text x="650" y="293" text-anchor="middle" font-size="9" fill="#BBBBBB">...</text>

  <!-- ============ values that change ============ -->
  <text x="450" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="0.5">Values that change per tab</text>
  <rect x="160" y="374" width="155" height="30" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="237" y="393" text-anchor="middle" font-size="10" fill="#1a1a1a">Header / tab bar color</text>
  <rect x="325" y="374" width="160" height="30" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="405" y="393" text-anchor="middle" font-size="10" fill="#1a1a1a">Text color (auto-flip)</text>
  <rect x="495" y="374" width="245" height="30" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="617" y="393" text-anchor="middle" font-size="10" fill="#1a1a1a">Some child components (e.g. chips)</text>

  <!-- ============ design decision ============ -->
  <line x1="120" y1="430" x2="780" y2="430" stroke="#E5E5E5" stroke-width="1"/>
  <text x="450" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="0.5">Design decision — move subscription responsibility into a wrapper widget</text>

  <rect x="70" y="476" width="360" height="134" rx="8" fill="#F8F8F8" stroke="#E5E5E5" stroke-width="1"/>
  <text x="250" y="502" text-anchor="middle" font-size="11" font-weight="700" fill="#999">Approaches considered but rejected</text>
  <text x="92" y="532" font-size="11" fill="#666">1. Each component subscribes to color</text>
  <text x="104" y="550" font-size="10" fill="#777" font-style="italic">Can't reuse where color isn't needed</text>
  <text x="92" y="578" font-size="11" fill="#666">2. BE sends color to each component</text>
  <text x="104" y="596" font-size="10" fill="#777" font-style="italic">Color duplicated across components → inconsistency</text>

  <line x1="440" y1="543" x2="478" y2="543" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arc)"/>

  <rect x="488" y="476" width="360" height="134" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="668" y="502" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">Chosen — wrapper subscribes, then injects</text>
  <text x="510" y="532" font-size="11" fill="#666">A wrapper widget subscribes to color/type</text>
  <text x="510" y="550" font-size="11" fill="#666">and injects it into each component</text>
  <text x="510" y="578" font-size="10" fill="#777" font-style="italic">Component stays reusable (unaware of color),</text>
  <text x="510" y="596" font-size="10" fill="#777" font-style="italic">BE doesn't need to send color per component</text>

  <text x="450" y="648" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Isolating the color-subscription responsibility in a wrapper preserved both reusability and data consistency.</text>

</svg>
