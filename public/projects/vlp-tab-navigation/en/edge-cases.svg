<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Noto Sans', system-ui, -apple-system, sans-serif">
  <rect width="900" height="680" fill="#FAFAFA"/>

  <defs>
    <marker id="are" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="0.5">Edge Cases Anticipated and Defended Before Implementation</text>
  <text x="450" y="62" text-anchor="middle" font-size="11" fill="#999">Problems from fast tab switching, pagination, and caching — anticipated up front and guarded against</text>

  <text x="355" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#AAA" letter-spacing="1">ANTICIPATED SITUATION</text>
  <text x="700" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a" letter-spacing="1">DEFENSE</text>

  <!-- ===== CASE 1 ===== -->
  <rect x="60" y="108" width="780" height="118" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="84" y="135" font-size="12" font-weight="700" fill="#1a1a1a">1. A stale response overwrites the current tab on fast switching</text>

  <rect x="84" y="150" width="450" height="60" rx="8" fill="#F8F8F8" stroke="#E5E5E5" stroke-width="1"/>
  <text x="309" y="176" text-anchor="middle" font-size="11" fill="#555">When tabs switch rapidly, a previous response</text>
  <text x="309" y="194" text-anchor="middle" font-size="11" fill="#555">may arrive late and overwrite the current tab</text>

  <line x1="544" y1="180" x2="576" y2="180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#are)"/>

  <rect x="586" y="150" width="230" height="60" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="701" y="176" text-anchor="middle" font-size="10.5" fill="#333">On a new tab-switch event,</text>
  <text x="701" y="194" text-anchor="middle" font-size="10.5" fill="#333">cancel the previous event and its request</text>

  <!-- ===== CASE 2 ===== -->
  <rect x="60" y="238" width="780" height="130" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="84" y="265" font-size="12" font-weight="700" fill="#1a1a1a">2. A previous tab's pagination response is applied after switching</text>

  <rect x="84" y="280" width="450" height="72" rx="8" fill="#F8F8F8" stroke="#E5E5E5" stroke-width="1"/>
  <text x="309" y="304" text-anchor="middle" font-size="11" fill="#555">Tab switch and pagination are separate events, so one</text>
  <text x="309" y="322" text-anchor="middle" font-size="11" fill="#555">can't cancel the other — the previous tab's pagination</text>
  <text x="309" y="340" text-anchor="middle" font-size="11" fill="#555">survives and its response arrives late</text>

  <line x1="544" y1="316" x2="576" y2="316" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#are)"/>

  <rect x="586" y="280" width="230" height="72" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="701" y="304" text-anchor="middle" font-size="11" fill="#333">Before applying the response,</text>
  <text x="701" y="322" text-anchor="middle" font-size="11" fill="#333">verify the state still awaits</text>
  <text x="701" y="340" text-anchor="middle" font-size="11" fill="#333">pagination; drop if stale</text>

  <!-- ===== CASE 3 ===== -->
  <rect x="60" y="380" width="780" height="118" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="84" y="407" font-size="12" font-weight="700" fill="#1a1a1a">3. Home-tab content cache grows unbounded, slowing restoration</text>

  <rect x="84" y="422" width="450" height="60" rx="8" fill="#F8F8F8" stroke="#E5E5E5" stroke-width="1"/>
  <text x="309" y="448" text-anchor="middle" font-size="11" fill="#555">As pages accumulate, the cache grows without bound</text>
  <text x="309" y="466" text-anchor="middle" font-size="11" fill="#555">and causes frame drops on restore</text>

  <line x1="544" y1="452" x2="576" y2="452" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#are)"/>

  <rect x="586" y="422" width="230" height="60" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="701" y="448" text-anchor="middle" font-size="11" fill="#333">Cache only the first page;</text>
  <text x="701" y="466" text-anchor="middle" font-size="11" fill="#333">refetch the rest as the user scrolls</text>

  <!-- ===== CASE 4 ===== -->
  <rect x="60" y="510" width="780" height="118" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="84" y="537" font-size="12" font-weight="700" fill="#1a1a1a">4. A stale cached tab list shows first and doesn't work when tapped</text>

  <rect x="84" y="552" width="450" height="60" rx="8" fill="#F8F8F8" stroke="#E5E5E5" stroke-width="1"/>
  <text x="309" y="578" text-anchor="middle" font-size="11" fill="#555">If the cached tab list differs from the real response,</text>
  <text x="309" y="596" text-anchor="middle" font-size="11" fill="#555">tapping that tab doesn't work correctly</text>

  <line x1="544" y1="582" x2="576" y2="582" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#are)"/>

  <rect x="586" y="552" width="230" height="60" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="701" y="578" text-anchor="middle" font-size="11" fill="#333">Exclude the tab list from caching;</text>
  <text x="701" y="596" text-anchor="middle" font-size="11" fill="#333">show tabs only after the real response</text>

  <text x="450" y="658" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Each situation was anticipated before implementation, with a matching defense built into the design.</text>

</svg>
