<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Noto Sans CJK KR', 'Noto Sans KR', system-ui, -apple-system, sans-serif">
  <rect width="900" height="680" fill="#FAFAFA"/>

  <defs>
    <marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="1">탭 전환 시 색상 동기화</text>
  <text x="450" y="59" text-anchor="middle" font-size="11" fill="#999">탭을 바꾸면 헤더·탭 바와 일부 하위 컴포넌트 색이 함께 바뀌고, 글자색은 배경 밝기에 따라 자동 전환</text>

  <!-- ============ 폰 A: 밝은 헤더 ============ -->
  <text x="240" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#999" letter-spacing="1.5">탭 A — 밝은 헤더</text>
  <rect x="120" y="112" width="240" height="210" rx="20" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>

  <path d="M120 132 a20 20 0 0 1 20 -20 h200 a20 20 0 0 1 20 20 v68 h-240 z" fill="#EDEDED"/>
  <text x="140" y="150" font-size="11" font-weight="700" fill="#1a1a1a">헤더</text>
  <text x="340" y="150" text-anchor="end" font-size="9" fill="#888">밝은 배경 → 검정 글자</text>

  <rect x="138" y="166" width="62" height="30" rx="5" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
  <text x="169" y="185" text-anchor="middle" font-size="10" fill="#1a1a1a">Home</text>
  <rect x="206" y="166" width="62" height="30" rx="5" fill="#E3E3E3"/>
  <text x="237" y="185" text-anchor="middle" font-size="10" fill="#999">Fresh</text>
  <rect x="274" y="166" width="62" height="30" rx="5" fill="#E3E3E3"/>
  <text x="305" y="185" text-anchor="middle" font-size="10" fill="#999">Snacks</text>

  <rect x="138" y="216" width="184" height="44" rx="4" fill="#F4F4F4" stroke="#EAEAEA" stroke-width="1"/>
  <text x="230" y="242" text-anchor="middle" font-size="9" fill="#999">컴포넌트</text>
  <rect x="138" y="270" width="184" height="38" rx="4" fill="#F8F8F8" stroke="#EFEFEF" stroke-width="1"/>
  <text x="230" y="293" text-anchor="middle" font-size="9" fill="#BBBBBB">...</text>

  <line x1="378" y1="217" x2="520" y2="217" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arc)"/>
  <text x="450" y="208" text-anchor="middle" font-size="10" fill="#666" font-style="italic">탭 전환</text>

  <!-- ============ 폰 B: 어두운 헤더 ============ -->
  <text x="660" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#999" letter-spacing="1.5">탭 B — 어두운 헤더</text>
  <rect x="540" y="112" width="240" height="210" rx="20" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>

  <path d="M540 132 a20 20 0 0 1 20 -20 h200 a20 20 0 0 1 20 20 v68 h-240 z" fill="#3A3A3A"/>
  <text x="560" y="150" font-size="11" font-weight="700" fill="#FFFFFF">헤더</text>
  <text x="760" y="150" text-anchor="end" font-size="9" fill="#BBB">어두운 배경 → 흰 글자</text>

  <rect x="558" y="166" width="62" height="30" rx="5" fill="#2E2E2E" stroke="#FFFFFF" stroke-width="2"/>
  <text x="589" y="185" text-anchor="middle" font-size="10" fill="#FFFFFF">Home</text>
  <rect x="626" y="166" width="62" height="30" rx="5" fill="#525252"/>
  <text x="657" y="185" text-anchor="middle" font-size="10" fill="#BBB">Fresh</text>
  <rect x="694" y="166" width="62" height="30" rx="5" fill="#525252"/>
  <text x="725" y="185" text-anchor="middle" font-size="10" fill="#BBB">Snacks</text>

  <rect x="558" y="216" width="184" height="44" rx="4" fill="#F4F4F4" stroke="#EAEAEA" stroke-width="1"/>
  <text x="650" y="242" text-anchor="middle" font-size="9" fill="#999">컴포넌트</text>
  <rect x="558" y="270" width="184" height="38" rx="4" fill="#F8F8F8" stroke="#EFEFEF" stroke-width="1"/>
  <text x="650" y="293" text-anchor="middle" font-size="9" fill="#BBBBBB">...</text>

  <!-- ============ 바뀌는 값 ============ -->
  <text x="450" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="1">탭마다 함께 바뀌어야 하는 값</text>
  <rect x="180" y="374" width="125" height="30" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="242" y="393" text-anchor="middle" font-size="10" fill="#1a1a1a">헤더·탭 바 배경색</text>
  <rect x="315" y="374" width="135" height="30" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="382" y="393" text-anchor="middle" font-size="10" fill="#1a1a1a">글자색(자동 전환)</text>
  <rect x="460" y="374" width="245" height="30" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="582" y="393" text-anchor="middle" font-size="10" fill="#1a1a1a">칩 등 일부 컴포넌트 배경·글자색</text>

  <!-- ============ 설계 결정 ============ -->
  <line x1="120" y1="430" x2="780" y2="430" stroke="#E5E5E5" stroke-width="1"/>
  <text x="450" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="1">설계 결정 — 구독 책임을 wrapper 위젯으로 분리</text>

  <!-- 검토했으나 안 쓴 방식 -->
  <rect x="70" y="476" width="360" height="134" rx="8" fill="#F8F8F8" stroke="#E5E5E5" stroke-width="1"/>
  <text x="250" y="502" text-anchor="middle" font-size="11" font-weight="700" fill="#999">검토했으나 채택하지 않은 방식</text>
  <text x="92" y="532" font-size="11" fill="#666">① 컴포넌트가 색상을 직접 구독</text>
  <text x="104" y="550" font-size="10" fill="#777" font-style="italic">색상이 필요 없는 곳에서 재사용 불가</text>
  <text x="92" y="578" font-size="11" fill="#666">② BE가 컴포넌트마다 색상 전달</text>
  <text x="104" y="596" font-size="10" fill="#777" font-style="italic">데이터 일관성 저하</text>

  <line x1="440" y1="543" x2="478" y2="543" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arc)"/>

  <!-- 채택한 방식 -->
  <rect x="488" y="476" width="360" height="134" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="668" y="502" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">채택 — wrapper 위젯이 구독 후 주입</text>
  <text x="510" y="532" font-size="11" fill="#666">컴포넌트를 감싸는 wrapper 위젯이</text>
  <text x="510" y="550" font-size="11" fill="#666">색상·타입을 구독해 컴포넌트에 inject</text>
  <text x="510" y="578" font-size="10" fill="#777" font-style="italic">컴포넌트는 색상을 몰라 재사용 가능,</text>
  <text x="510" y="596" font-size="10" fill="#777" font-style="italic">BE도 컴포넌트마다 색상 전달 불필요</text>

  <text x="450" y="648" text-anchor="middle" font-size="12" fill="#666" font-style="italic">색상 구독이라는 책임을 wrapper 위젯으로 분리해, 재사용성과 데이터 일관성을 모두 확보.</text>

</svg>
