<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Noto Sans CJK KR', 'Noto Sans KR', system-ui, -apple-system, sans-serif">
  <rect width="900" height="680" fill="#FAFAFA"/>

  <defs>
    <marker id="are" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="1">예측한 엣지 케이스와 방어 설계</text>
  <text x="450" y="62" text-anchor="middle" font-size="11" fill="#999">빠른 탭 전환·페이지네이션·캐싱을 다루며 생길 수 있는 문제를 구현 전에 예측해 방어</text>

  <!-- 컬럼 헤더 -->
  <text x="370" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#AAA" letter-spacing="1">예측한 상황</text>
  <text x="690" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a" letter-spacing="1">방어 설계</text>

  <!-- ===== CASE 1 ===== -->
  <rect x="60" y="108" width="780" height="118" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="84" y="135" font-size="12" font-weight="700" fill="#1a1a1a">1. 빠른 탭 전환 시 이전 응답이 현재 탭을 덮어쓰는 문제</text>

  <rect x="84" y="150" width="430" height="60" rx="8" fill="#F8F8F8" stroke="#E5E5E5" stroke-width="1"/>
  <text x="299" y="176" text-anchor="middle" font-size="11" fill="#555">탭을 빠르게 연속 전환하면, 이전 탭 전환의</text>
  <text x="299" y="194" text-anchor="middle" font-size="11" fill="#555">응답이 뒤늦게 도착해 현재 탭을 덮어씀</text>

  <line x1="524" y1="180" x2="556" y2="180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#are)"/>

  <rect x="566" y="150" width="250" height="60" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="691" y="176" text-anchor="middle" font-size="11" fill="#333">새 탭 전환 이벤트가 오면</text>
  <text x="691" y="194" text-anchor="middle" font-size="11" fill="#333">이전 이벤트와 그 요청을 취소</text>

  <!-- ===== CASE 2 ===== -->
  <rect x="60" y="238" width="780" height="130" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="84" y="265" font-size="12" font-weight="700" fill="#1a1a1a">2. 페이지네이션 도중 탭 전환 시 이전 탭의 페이지네이션 응답이 반영되는 문제</text>

  <rect x="84" y="280" width="430" height="72" rx="8" fill="#F8F8F8" stroke="#E5E5E5" stroke-width="1"/>
  <text x="299" y="304" text-anchor="middle" font-size="11" fill="#555">탭 전환과 페이지네이션은 서로 다른 이벤트라</text>
  <text x="299" y="322" text-anchor="middle" font-size="11" fill="#555">한쪽이 다른 쪽을 취소하지 못함 → 이전 탭의</text>
  <text x="299" y="340" text-anchor="middle" font-size="11" fill="#555">페이지네이션 응답이 뒤늦게 도착</text>

  <line x1="524" y1="316" x2="556" y2="316" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#are)"/>

  <rect x="566" y="280" width="250" height="72" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="691" y="304" text-anchor="middle" font-size="11" fill="#333">응답 반영 직전, 현재 상태가</text>
  <text x="691" y="322" text-anchor="middle" font-size="11" fill="#333">여전히 페이지네이션을 기다리는</text>
  <text x="691" y="340" text-anchor="middle" font-size="11" fill="#333">상태인지 확인해 어긋난 응답 폐기</text>

  <!-- ===== CASE 3 ===== -->
  <rect x="60" y="380" width="780" height="118" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="84" y="407" font-size="12" font-weight="700" fill="#1a1a1a">3. 홈 탭 콘텐츠 캐시 누적으로 화면 복원이 느려지는 문제</text>

  <rect x="84" y="422" width="430" height="60" rx="8" fill="#F8F8F8" stroke="#E5E5E5" stroke-width="1"/>
  <text x="299" y="448" text-anchor="middle" font-size="11" fill="#555">페이지를 넘길수록 캐시가 무한정 커져</text>
  <text x="299" y="466" text-anchor="middle" font-size="11" fill="#555">복원 시 끊김(frame drop)이 발생</text>

  <line x1="524" y1="452" x2="556" y2="452" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#are)"/>

  <rect x="566" y="422" width="250" height="60" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="691" y="448" text-anchor="middle" font-size="11" fill="#333">첫 페이지만 캐싱하고,</text>
  <text x="691" y="466" text-anchor="middle" font-size="11" fill="#333">이후 페이지는 복원 시 새로 조회</text>

  <!-- ===== CASE 4 ===== -->
  <rect x="60" y="510" width="780" height="118" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="84" y="537" font-size="12" font-weight="700" fill="#1a1a1a">4. 탭 목록 캐싱으로 오래된 탭이 먼저 떠 정상 동작하지 않는 문제</text>

  <rect x="84" y="552" width="430" height="60" rx="8" fill="#F8F8F8" stroke="#E5E5E5" stroke-width="1"/>
  <text x="299" y="578" text-anchor="middle" font-size="11" fill="#555">캐싱된 탭 목록이 실제 응답과 다르면,</text>
  <text x="299" y="596" text-anchor="middle" font-size="11" fill="#555">사용자가 그 탭을 눌러도 정상 동작하지 않음</text>

  <line x1="524" y1="582" x2="556" y2="582" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#are)"/>

  <rect x="566" y="552" width="250" height="60" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="691" y="578" text-anchor="middle" font-size="11" fill="#333">탭 목록은 캐싱에서 제외해,</text>
  <text x="691" y="596" text-anchor="middle" font-size="11" fill="#333">실제 응답 도착 후에만 탭 표시</text>

  <text x="450" y="658" text-anchor="middle" font-size="12" fill="#666" font-style="italic">구현 전에 각 상황을 예측하고, 상황에 맞는 방어를 설계 단계에서 반영.</text>

</svg>
