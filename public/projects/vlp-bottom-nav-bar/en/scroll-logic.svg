<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="580" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="1">NOTIFICATIONLISTENER SCROLL GUARDS</text>

  <!-- Top: incoming -->
  <rect x="260" y="65" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="280" y="97" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">INCOMING</text>
  <text x="450" y="97" text-anchor="middle" font-size="12" fill="#1a1a1a">All ScrollNotifications</text>

  <!-- Arrow -->
  <line x1="450" y1="120" x2="450" y2="140" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Guard 1 -->
  <rect x="260" y="145" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="280" y="169" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">GUARD 1</text>
  <text x="450" y="169" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Scroll update events only</text>
  <text x="450" y="188" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">skips ScrollStart, ScrollEnd, Overscroll</text>

  <!-- Arrow -->
  <line x1="450" y1="200" x2="450" y2="220" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Guard 2 -->
  <rect x="260" y="225" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="280" y="249" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">GUARD 2</text>
  <text x="450" y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Vertical axis only</text>
  <text x="450" y="268" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">skips horizontal scrolls</text>

  <!-- Arrow -->
  <line x1="450" y1="280" x2="450" y2="300" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Guard 3 -->
  <rect x="260" y="305" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="280" y="329" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">GUARD 3</text>
  <text x="450" y="329" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Valid scrollable range only</text>
  <text x="450" y="348" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">skips out-of-range scrolls</text>

  <!-- Arrow -->
  <line x1="450" y1="360" x2="450" y2="380" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Guard 4 -->
  <rect x="260" y="385" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="280" y="409" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">GUARD 4</text>
  <text x="450" y="409" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Significant movement only</text>
  <text x="450" y="428" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">skips minor scroll movements</text>

  <!-- Arrow -->
  <line x1="450" y1="440" x2="450" y2="460" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom: outcome -->
  <rect x="260" y="465" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
  <text x="280" y="497" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">OUTCOME</text>
  <text x="450" y="497" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Animate nav bar</text>

  <!-- Caption -->
  <text x="450" y="555" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Four guards filter scroll events before animating the nav bar to show or hide.</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
</svg>
