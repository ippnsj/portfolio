<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Noto Sans CJK KR', 'Noto Sans KR', system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="580" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="1">NOTIFICATIONLISTENER 스크롤 가드</text>

  <!-- Top: incoming -->
  <rect x="260" y="65" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="280" y="97" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">INCOMING</text>
  <text x="450" y="97" text-anchor="middle" font-size="12" fill="#1a1a1a">모든 ScrollNotification</text>

  <!-- Arrow -->
  <line x1="450" y1="120" x2="450" y2="140" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Guard 1 -->
  <rect x="260" y="145" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="280" y="169" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">GUARD 1</text>
  <text x="450" y="169" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">ScrollUpdate 이벤트만</text>
  <text x="450" y="188" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">ScrollStart, ScrollEnd, Overscroll 제외</text>

  <!-- Arrow -->
  <line x1="450" y1="200" x2="450" y2="220" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Guard 2 -->
  <rect x="260" y="225" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="280" y="249" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">GUARD 2</text>
  <text x="450" y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">세로 방향 스크롤만</text>
  <text x="450" y="268" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">가로 스크롤 제외</text>

  <!-- Arrow -->
  <line x1="450" y1="280" x2="450" y2="300" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Guard 3 -->
  <rect x="260" y="305" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="280" y="329" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">GUARD 3</text>
  <text x="450" y="329" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">유효한 스크롤 범위만</text>
  <text x="450" y="348" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">범위를 벗어난 스크롤 제외</text>

  <!-- Arrow -->
  <line x1="450" y1="360" x2="450" y2="380" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Guard 4 -->
  <rect x="260" y="385" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="280" y="409" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">GUARD 4</text>
  <text x="450" y="409" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">의미 있는 움직임만</text>
  <text x="450" y="428" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">미세한 스크롤 움직임 제외</text>

  <!-- Arrow -->
  <line x1="450" y1="440" x2="450" y2="460" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom: outcome -->
  <rect x="260" y="465" width="380" height="55" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
  <text x="280" y="497" font-size="10" font-weight="700" fill="#999" letter-spacing="1.5">OUTCOME</text>
  <text x="450" y="497" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">하단 바 애니메이션 실행</text>

  <!-- Caption -->
  <text x="450" y="555" text-anchor="middle" font-size="12" fill="#666" font-style="italic">4개의 가드가 스크롤 이벤트를 필터링한 뒤에야 하단 바가 나타나거나 사라짐.</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
</svg>
